{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-4 border-info">
            <div class="card-header bg-info text-dark">
                <h4 class="mb-0">📘 เพิ่มวิชาเรียนใหม่</h4>
            </div>
            <div class="card-body">
                <form action="/add_class" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">ชื่อวิชา <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" required placeholder="เช่น Artificial Intelligence">
                    </div>
                    <div class="mb-3">
                        <label for="day" class="form-label">วันที่เรียน</label>
                        <select class="form-select" id="day" name="day">
                            <option value="วันจันทร์">วันจันทร์</option>
                            <option value="วันอังคาร">วันอังคาร</option>
                            <option value="วันพุธ">วันพุธ</option>
                            <option value="วันพฤหัสบดี">วันพฤหัสบดี</option>
                            <option value="วันศุกร์">วันศุกร์</option>
                            <option value="วันเสาร์">วันเสาร์</option>
                            <option value="วันอาทิตย์">วันอาทิตย์</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="time" class="form-label">เวลาเรียน</label>
                        <input type="text" class="form-control" id="time" name="time" placeholder="เช่น 09:00 - 12:00">
                    </div>
                    <button type="submit" class="btn btn-info w-100 text-white">บันทึกตารางเรียน</button>
                    <a href="/schedule" class="btn btn-secondary w-100 mt-2">ยกเลิก</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
