{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">✏️ แก้ไขงาน</h4>
            </div>
            <div class="card-body">
                <form action="/edit_task/{{ task.id }}" method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">ชื่องาน <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ task.title }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">รายละเอียด</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ task.description }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="due_date" class="form-label">กำหนดส่ง</label>
                        <input type="date" class="form-control" id="due_date" name="due_date" value="{{ task.due_date }}">
                    </div>
                    <div class="mb-3">
                        <label for="status" class="form-label">สถานะ</label>
                        <select class="form-select" id="status" name="status">
                            <option value="Pending" {% if task.status == 'Pending' %}selected{% endif %}>Pending (รอดำเนินการ)</option>
                            <option value="Done" {% if task.status == 'Done' %}selected{% endif %}>Done (เสร็จแล้ว)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-warning w-100">อัปเดตข้อมูล</button>
                    <a href="/dashboard" class="btn btn-secondary w-100 mt-2">ยกเลิก</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
