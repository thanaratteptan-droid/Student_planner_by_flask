{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0" style="border-radius: 1.25rem;">
            <div class="card-header bg-warning text-dark border-0 py-3 text-center" style="border-radius: 1.25rem 1.25rem 0 0;">
                <h4 class="mb-0 fw-bold">✏️ แก้ไขงาน</h4>
            </div>
            <div class="card-body p-4 bg-body">
                <form action="/edit_task/{{ task.id }}" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary">ชื่องาน (Title) <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="title" value="{{ task.title }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary">รายละเอียด (Description)</label>
                        <textarea class="form-control" name="description" rows="3">{{ task.description }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-secondary">กำหนดส่ง (Due Date)</label>
                            <input type="date" class="form-control" name="due_date" value="{{ task.due_date }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-secondary">ระดับความสำคัญ</label>
                            <select class="form-select" name="priority">
                                <option value="🔥 ด่วนมาก" {% if task.priority == '🔥 ด่วนมาก' %}selected{% endif %}>🔥 ด่วนมาก</option>
                                <option value="⚡ ปานกลาง" {% if task.priority == '⚡ ปานกลาง' %}selected{% endif %}>⚡ ปานกลาง</option>
                                <option value="🍃 ชิลๆ" {% if task.priority == '🍃 ชิลๆ' %}selected{% endif %}>🍃 ชิลๆ</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">สถานะงาน (Status)</label>
                        <select class="form-select" name="status">
                            <option value="Pending" {% if task.status == 'Pending' %}selected{% endif %}>⏳ กำลังทำ (Pending)</option>
                            <option value="Done" {% if task.status == 'Done' %}selected{% endif %}>✅ เสร็จแล้ว (Done)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 rounded-pill fw-bold py-2 mb-2 shadow-sm">💾 อัปเดตข้อมูล</button>
                    <a href="/dashboard" class="btn btn-light w-100 rounded-pill text-muted">ยกเลิก</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
