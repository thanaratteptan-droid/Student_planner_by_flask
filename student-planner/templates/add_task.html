{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">เพิ่มงาน/การบ้านใหม่</h4>
            </div>
            <div class="card-body">
                <form action="/add_task" method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">ชื่องาน <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">รายละเอียด</label>
                        <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="due_date" class="form-label">กำหนดส่ง</label>
                        <input type="date" class="form-control" id="due_date" name="due_date">
                    </div>
                    <button type="submit" class="btn btn-success w-100">บันทึกข้อมูล</button>
                    <a href="/dashboard" class="btn btn-secondary w-100 mt-2">ยกเลิก</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
