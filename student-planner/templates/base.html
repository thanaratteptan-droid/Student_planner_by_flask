<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Student Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* ฐานสีแบรนด์ */
            --sp-primary: #4e73df; /* Deep Indigo Blue */
            --sp-teal: #1abc9c; /* Modern Teal */
            --sp-accent: #f39c12; /* Vibrant Orange */
            --sp-font-headings: 'Poppins', sans-serif;
            --sp-font-body: 'Inter', sans-serif;
            
            --bs-body-font-family: var(--sp-font-body);
            --bs-heading-font-family: var(--sp-font-headings);
            --bs-primary: var(--sp-primary);
            --bs-secondary: #eaecf0;
            --bs-success: var(--sp-teal);
            --bs-warning: var(--sp-accent);
            --bs-danger: #e74c3c;
        }

        [data-bs-theme="dark"] {
            --bs-body-bg: #212529; /* นุ่มนวลกว่าดำสนิท */
            --bs-body-color: #eaecf0;
            --bs-secondary-bg: #2b3035;
            --bs-secondary: #343a40;
            --bs-primary: #85a4ff; /* เพิ่มความสว่างให้สีแบรนด์เมื่ออยู่บนพื้นหลังมืด */
        }

        
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: transform 0.2s ease-in-out;
        }

        .btn {
            font-family: var(--sp-font-headings);
            border-radius: 0.75rem;
            padding: 0.6rem 1.25rem;
            font-weight: 500;
        }

        .form-control, .form-select {
            border-radius: 0.75rem;
            border: 1px solid var(--bs-secondary);
            padding: 0.75rem 1rem;
        }
        
        body {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="/">
                📚 <span class="ms-2">Student Planner</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    
                    <li class="nav-item me-4 d-none d-lg-block">
                        <span id="realtimeClock" class="text-light opacity-75 fw-medium" style="font-size: 0.85rem; letter-spacing: 0.5px;">
                            กำลังโหลดเวลา...
                        </span>
                    </li>

                    <li class="nav-item d-flex align-items-center me-3">
                        <button class="btn btn-sm btn-outline-light" id="darkModeToggle">🌙 Dark Mode</button>
                    </li>

                    {% if 'username' in session %}
                        <li class="nav-item"><a class="nav-link" href="/dashboard">งานของฉัน</a></li>
                        <li class="nav-item"><a class="nav-link" href="/history">งานที่เสร็จแล้ว</a></li>
                        <li class="nav-item"><a class="nav-link" href="/schedule">ตารางเรียน</a></li>
                        <li class="nav-item"><a class="nav-link" href="/profile">👤 โปรไฟล์</a></li>
                        <li class="nav-item"><a class="btn btn-outline-danger ms-2" href="/logout">ออกจากระบบ</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="/login">เข้าสู่ระบบ</a></li>
                        <li class="nav-item"><a class="btn btn-primary ms-2" href="/register">สมัครสมาชิก</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const htmlElement = document.documentElement;
        const themeToggleBtn = document.getElementById('darkModeToggle');
        
        const currentTheme = localStorage.getItem('bsTheme') || 'light';
        htmlElement.setAttribute('data-bs-theme', currentTheme);
        updateButton(currentTheme);

        themeToggleBtn.addEventListener('click', function() {
            const current = htmlElement.getAttribute('data-bs-theme');
            const targetTheme = current === 'light' ? 'dark' : 'light';
            
            htmlElement.setAttribute('data-bs-theme', targetTheme);
            localStorage.setItem('bsTheme', targetTheme); 
            updateButton(targetTheme);
        });

        function updateButton(theme) {
            if (theme === 'dark') {
                themeToggleBtn.innerHTML = '☀️ Light Mode';
                themeToggleBtn.classList.replace('btn-outline-light', 'btn-outline-warning');
            } else {
                themeToggleBtn.innerHTML = '🌙 Dark Mode';
                themeToggleBtn.classList.replace('btn-outline-warning', 'btn-outline-light');
            }
        }
    </script>

<script>
        function updateClock() {
            const now = new Date();
            
            // ตั้งค่ารูปแบบการแสดงผล (ใช้ภาษาไทย)
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
            };
            
            // ดึงวันที่
            const dateString = now.toLocaleDateString('th-TH', options);
            
            // ดึงเวลา (ชั่วโมง นาที วินาที)
            const timeString = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            // นำมารวมกันแล้วยัดใส่ใน Navbar
            document.getElementById('realtimeClock').innerHTML = `📅 ${dateString} &nbsp; ⏰ ${timeString}`;
        }

        // สั่งให้ฟังก์ชันทำงานทันทีที่โหลดหน้าเว็บ
        updateClock();
        
        // สั่งให้อัปเดตเวลาทุกๆ 1 วินาที (1000 มิลลิวินาที)
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
