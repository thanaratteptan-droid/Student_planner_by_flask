<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">📚 Student Planner</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    
                    <li class="nav-item d-flex align-items-center me-3">
                        <button class="btn btn-sm btn-outline-light" id="darkModeToggle">🌙 Dark Mode</button>
                    </li>

                    {% if 'username' in session %}
                        <li class="nav-item">
                            <a class="nav-link" href="/dashboard">งานของฉัน</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/history">งานที่เสร็จแล้ว</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/schedule">ตารางเรียน</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/profile">👤 โปรไฟล์</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-outline-danger ms-2" href="/logout">ออกจากระบบ</a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="/login">เข้าสู่ระบบ</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-primary ms-2" href="/register">สมัครสมาชิก</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const htmlElement = document.documentElement;
        const themeToggleBtn = document.getElementById('darkModeToggle');
        
        // เช็คว่าเคยตั้งค่าธีมไว้ไหม ถ้าไม่เคยให้ใช้แบบสว่าง
        const currentTheme = localStorage.getItem('bsTheme') || 'light';
        htmlElement.setAttribute('data-bs-theme', currentTheme);
        updateButton(currentTheme);

        themeToggleBtn.addEventListener('click', function() {
            const current = htmlElement.getAttribute('data-bs-theme');
            const targetTheme = current === 'light' ? 'dark' : 'light';
            
            htmlElement.setAttribute('data-bs-theme', targetTheme);
            localStorage.setItem('bsTheme', targetTheme); // จำค่าไว้ในเครื่อง
            updateButton(targetTheme);
        });

        function updateButton(theme) {
            if (theme === 'dark') {
                themeToggleBtn.innerHTML = '☀️ Light Mode';
                themeToggleBtn.classList.replace('btn-outline-light', 'btn-outline-warning');
            } else {
                themeToggleBtn.innerHTML = '🌙 Dark Mode';
                themeToggleBtn.classList.replace('btn-outline-warning', 'btn-outline-light');
            }
        }
    </script>
</body>
</html>
