<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Student Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* ฐานสีแบรนด์ */
            --sp-primary: #4e73df; /* Deep Indigo Blue */
            --sp-teal: #1abc9c; /* Modern Teal */
            --sp-accent: #f39c12; /* Vibrant Orange */
            --sp-font-headings: 'Poppins', sans-serif;
            --sp-font-body: 'Inter', sans-serif;
            
            --bs-body-font-family: var(--sp-font-body);
            --bs-heading-font-family: var(--sp-font-headings);
            --bs-primary: var(--sp-primary);
            --bs-secondary: #eaecf0;
            --bs-success: var(--sp-teal);
            --bs-warning: var(--sp-accent);
            --bs-danger: #e74c3c;
        }

        [data-bs-theme="dark"] {
            --bs-body-bg: #212529; /* นุ่มนวลกว่าดำสนิท */
            --bs-body-color: #eaecf0;
            --bs-secondary-bg: #2b3035;
            --bs-secondary: #343a40;
            --bs-primary: #85a4ff; /* เพิ่มความสว่างให้สีแบรนด์เมื่ออยู่บนพื้นหลังมืด */
        }

        
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: transform 0.2s ease-in-out;
        }

        .btn {
            font-family: var(--sp-font-headings);
            border-radius: 0.75rem;
            padding: 0.6rem 1.25rem;
            font-weight: 500;
        }

        .form-control, .form-select {
            border-radius: 0.75rem;
            border: 1px solid var(--bs-secondary);
            padding: 0.75rem 1rem;
        }
        
        body {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="/">
                📚 <span class="ms-2">Student Planner</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    
                    <li class="nav-item me-4 d-none d-lg-block">
                        <span id="realtimeClock" class="text-light opacity-75 fw-medium" style="font-size: 0.85rem; letter-spacing: 0.5px;">
                            กำลังโหลดเวลา...
                        </span>
                    </li>

                    <li class="nav-item d-flex align-items-center me-3">
                        <button class="btn btn-sm btn-outline-light" id="darkModeToggle">🌙 Dark Mode</button>
                    </li>

                    {% if 'username' in session %}
                        <li class="nav-item"><a class="nav-link" href="/dashboard">งานของฉัน</a></li>
                        <li class="nav-item"><a class="nav-link" href="/schedule">ตารางเรียน</a></li>
                        <li class="nav-item"><a class="nav-link" href="/calendar">ปฏิทิน</a></li>
                        <li class="nav-item"><a class="nav-link" href="/profile">👤 โปรไฟล์</a></li>
                        <li class="nav-item"><a class="btn btn-outline-danger ms-2" href="/logout">ออกจากระบบ</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="/login">เข้าสู่ระบบ</a></li>
                        <li class="nav-item"><a class="btn btn-primary ms-2" href="/register">สมัครสมาชิก</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const htmlElement = document.documentElement;
        const themeToggleBtn = document.getElementById('darkModeToggle');
        
        const currentTheme = localStorage.getItem('bsTheme') || 'light';
        htmlElement.setAttribute('data-bs-theme', currentTheme);
        updateButton(currentTheme);

        themeToggleBtn.addEventListener('click', function() {
            const current = htmlElement.getAttribute('data-bs-theme');
            const targetTheme = current === 'light' ? 'dark' : 'light';
            
            htmlElement.setAttribute('data-bs-theme', targetTheme);
            localStorage.setItem('bsTheme', targetTheme); 
            updateButton(targetTheme);
        });

        function updateButton(theme) {
            if (theme === 'dark') {
                themeToggleBtn.innerHTML = '☀️ Light Mode';
                themeToggleBtn.classList.replace('btn-outline-light', 'btn-outline-warning');
            } else {
                themeToggleBtn.innerHTML = '🌙 Dark Mode';
                themeToggleBtn.classList.replace('btn-outline-warning', 'btn-outline-light');
            }
        }
    </script>

<script>
        function updateClock() {
            const now = new Date();
            
            // ตั้งค่ารูปแบบการแสดงผล (ใช้ภาษาไทย)
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
            };
            
            // ดึงวันที่
            const dateString = now.toLocaleDateString('th-TH', options);
            
            // ดึงเวลา (ชั่วโมง นาที วินาที)
            const timeString = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            // นำมารวมกันแล้วยัดใส่ใน Navbar
            document.getElementById('realtimeClock').innerHTML = `📅 ${dateString} &nbsp; ⏰ ${timeString}`;
        }

        // สั่งให้ฟังก์ชันทำงานทันทีที่โหลดหน้าเว็บ
        updateClock();
        
        // สั่งให้อัปเดตเวลาทุกๆ 1 วินาที (1000 มิลลิวินาที)
        setInterval(updateClock, 1000);
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // เช็คว่าตอนนี้ผู้ใช้เข้ามาที่หน้า add_class หรือไม่
            if (window.location.pathname === '/add_class') {
                
                const copyName = sessionStorage.getItem('prefill_class_name');
                const copyRoom = sessionStorage.getItem('prefill_class_room');
                
                // ถ้ามีข้อมูลที่ก๊อปปี้ไว้
                if (copyName) {
                    // หาช่อง Input (ดักชื่อแอตทริบิวต์ name ที่เป็นไปได้ทั้งหมด)
                    const nameInput = document.querySelector('input[name="name"]') || document.querySelector('input[name="title"]') || document.querySelector('input[name="subject"]');
                    const roomInput = document.querySelector('input[name="room"]');
                    
                    // จับค่ายัดลงช่อง Input
                    if (nameInput) nameInput.value = copyName;
                    if (roomInput && copyRoom) roomInput.value = copyRoom;
                    
                    // เด้งแจ้งเตือนมุมขวาบนเบาๆ ว่าวางข้อมูลให้แล้ว
                    if (typeof Swal !== 'undefined') {
                        const Toast = Swal.mixin({
                            toast: true,
                            position: 'top-end',
                            showConfirmButton: false,
                            timer: 4000,
                            timerProgressBar: true
                        });
                        Toast.fire({
                            icon: 'info',
                            title: '✨ วางข้อมูลวิชาเดิมให้แล้ว! เลือกแค่วัน/เวลาก็พอ'
                        });
                    }
                    
                    // เคลียร์ความจำทิ้ง เพื่อให้การกด "+ เพิ่มวิชาใหม่" ครั้งหน้าเป็นช่องว่างปกติ
                    sessionStorage.removeItem('prefill_class_name');
                    sessionStorage.removeItem('prefill_class_room');
                }
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        // -----------------------------------------
        // 🌟 ระบบ Global Pomodoro (ทำงานข้ามหน้าเว็บ)
        // -----------------------------------------
        
        // 1. แอบสร้างป้ายเวลา Pomodoro เล็กๆ ไว้บน Navbar อัตโนมัติ
        document.addEventListener("DOMContentLoaded", function() {
            let nav = document.querySelector('.navbar-nav');
            if (nav && !document.getElementById('navPomoBadge')) {
                let li = document.createElement('li');
                li.className = 'nav-item d-flex align-items-center me-3 mb-2 mb-lg-0';
                li.innerHTML = '<span id="navPomoBadge" class="badge rounded-pill bg-danger d-none shadow-sm" style="font-size: 0.85rem; transition: all 0.3s;"></span>';
                nav.insertBefore(li, nav.firstChild);
            }
        });

        // 2. ดึงสถานะจาก localStorage (จำค่าข้ามหน้า)
        window.pomoState = {
            timeLeft: parseInt(localStorage.getItem('pomoTimeLeft')) || 25 * 60,
            isRunning: localStorage.getItem('pomoIsRunning') === 'true',
            isWork: localStorage.getItem('pomoIsWork') !== 'false',
            endTime: parseInt(localStorage.getItem('pomoEndTime')) || 0
        };

        // 3. ฟังก์ชันคำนวณเวลาแบบอิงตามเวลาจริง (เวลาไม่เพี้ยนแม้ปิดแท็บ)
        window.updateGlobalPomo = function() {
            if (window.pomoState.isRunning) {
                let now = Date.now();
                window.pomoState.timeLeft = Math.round((window.pomoState.endTime - now) / 1000);

                // ถ้าหมดเวลา
                if (window.pomoState.timeLeft <= 0) {
                    window.pomoState.isRunning = false;
                    window.pomoState.isWork = !window.pomoState.isWork;
                    window.pomoState.timeLeft = window.pomoState.isWork ? 25 * 60 : 5 * 60;
                    
                    localStorage.setItem('pomoIsRunning', 'false');
                    localStorage.setItem('pomoIsWork', window.pomoState.isWork);
                    localStorage.setItem('pomoTimeLeft', window.pomoState.timeLeft);

                    // แจ้งเตือนเด้งได้ทุกหน้าเว็บ!
                    if (window.pomoState.isWork) {
                        Swal.fire('💪 หมดเวลาพัก!', 'ได้เวลาลุยงานต่อแล้ว ลุยเลย!', 'info');
                    } else {
                        Swal.fire('🎉 หมดเวลาโฟกัส!', 'เก่งมาก! พักสายตา ดื่มน้ำสัก 5 นาทีนะ', 'success');
                    }
                }
            }
            
            // แปลงเวลาเป็นรูปแบบ นาที:วินาที (MM:SS)
            let m = Math.floor(window.pomoState.timeLeft / 60).toString().padStart(2, '0');
            let s = (window.pomoState.timeLeft % 60).toString().padStart(2, '0');
            let timeString = `${m}:${s}`;

            // อัปเดตป้ายบน Navbar (ถ้ามี)
            let navBadge = document.getElementById('navPomoBadge');
            if (navBadge) {
                if (window.pomoState.isRunning) {
                    navBadge.classList.remove('d-none');
                    navBadge.innerText = window.pomoState.isWork ? `🍅 โฟกัส: ${timeString}` : `☕ พักเบรก: ${timeString}`;
                    navBadge.className = window.pomoState.isWork ? 'badge rounded-pill bg-danger shadow-sm' : 'badge rounded-pill bg-success shadow-sm';
                } else {
                    navBadge.classList.add('d-none');
                }
            }

            // ส่งสัญญาณไปอัปเดตหน้า Dashboard ด้วย (ถ้าเปิดหน้านั้นอยู่)
            document.dispatchEvent(new CustomEvent('pomoUpdated', { detail: { timeString } }));
        };

        // สั่งให้ระบบเดินตลอดเวลา (ทุกๆ 1 วินาที)
        setInterval(window.updateGlobalPomo, 1000);

        // 4. ฟังก์ชันควบคุม (เอาไว้ให้ปุ่มใน Dashboard เรียกใช้)
        window.togglePomo = function() {
            window.pomoState.isRunning = !window.pomoState.isRunning;
            localStorage.setItem('pomoIsRunning', window.pomoState.isRunning);
            
            if (window.pomoState.isRunning) {
                // คำนวณเวลาเป้าหมายล่วงหน้า (กันเน็ตหลุด/ปิดหน้าจอ)
                window.pomoState.endTime = Date.now() + window.pomoState.timeLeft * 1000;
                localStorage.setItem('pomoEndTime', window.pomoState.endTime);
            } else {
                localStorage.setItem('pomoTimeLeft', window.pomoState.timeLeft);
            }
            window.updateGlobalPomo();
        };

        window.resetPomo = function() {
            window.pomoState.isRunning = false;
            window.pomoState.isWork = true;
            window.pomoState.timeLeft = 25 * 60;
            localStorage.setItem('pomoIsRunning', 'false');
            localStorage.setItem('pomoIsWork', 'true');
            localStorage.setItem('pomoTimeLeft', 25 * 60);
            window.updateGlobalPomo();
        };
    </script>
</body>
</html>
